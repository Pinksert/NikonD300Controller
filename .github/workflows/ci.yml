name: 校验

# 每次 push / PR 都跑一遍，挡住两类"不报错但会静默出问题"的改动：
#   1. 纯函数回归（快门档位排序与显示、EXIF 重建、快门数解析）
#   2. 竖屏与横屏布局改了一个漏一个（横屏那份是整份复制，漏改不报错、
#      只在用户真的把手机横过来那一刻炸）

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ⚠️ 不要用 android-actions/setup-android@v3：它内部会跑 `sdkmanager tools`，
      #    而新 cmdline-tools(16.0) 里 legacy `tools` 包已经下架 →
      #    "Warning: Failed to find package 'tools'" + exit 1，整个 job 卡在第一步。
      #    ubuntu-latest 镜像本来就带 Android SDK 与 cmdline-tools，直接用即可。
      - name: 装 Android SDK 组件
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          if [ ! -x "$SDKM" ]; then echo "::error::找不到 sdkmanager（$SDK_ROOT）"; exit 1; fi
          echo "SDK_ROOT=$SDK_ROOT / sdkmanager=$SDKM"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          # compileSdk=36；NEF 解码要 NDK+CMake（build.gradle.kts 里 cmake 版本写死 3.22.1）
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" \
                             "ndk;28.2.13676358" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: 单元测试
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: 横屏 / 竖屏布局一致性
        run: python3 tools/check_layout_parity.py
